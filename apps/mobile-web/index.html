<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, 
    user-scalable=no, viewport-fit=cover"
    />
    <!-- 웹앱 모드 활성화 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 상태바를 투명하게 만들어 웹 페이지 배경이 상태바 영역까지 올라가게 함 -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!--
      일반 Safari 탭에서는 상태바와 하단 툴바가 브라우저 UI라 사진이 거기까지 올라가지
      못한다. 대신 이 색으로 칠해져서, 기본값인 흰색 대신 화면 배경과 이어져 보인다.
      (global.css의 --color-bg와 같은 값이어야 한다. HTML이라 변수를 쓸 수 없다.)
    -->
    <meta name="theme-color" content="#000000" />
    <title>일상 속 감사 찾기 - 삶으로 쓰는 예배전(展)</title>
    <meta
      name="description"
      content="삶으로 쓰는 예배전(展): 일상 속 감사 찾기에 사용되는 프로그램"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
